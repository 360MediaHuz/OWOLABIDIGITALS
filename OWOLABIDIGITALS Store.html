if(!S||!S.p)S={wa:'2349069674103',em:'owolabidigitals@gmail.com',cm:'',on:'Founder, OWOLABIDIGITALS',bio:'OWOLABIDIGITALS brings premium AI, design, streaming and productivity tools to customers in Nigeria at Naira prices. Message me on WhatsApp and I will help you pick the right plan.',p:JSON.parse(JSON.stringify(DEF))};
const save=()=>{};
let isOwner=false,art=null;
function buildDoc(){const c=document.body.cloneNode(true);c.querySelectorAll('script').forEach(x=>x.remove());c.querySelector('#v').innerHTML='';const t=c.querySelector('#toast');t.textContent='';t.className='';c.querySelector('#al').classList.add('hide');c.querySelectorAll('nav .on').forEach(x=>x.classList.remove('on'));
const h=document.head.cloneNode(true);h.querySelectorAll('script,meta[http-equiv]').forEach(x=>x.remove());
return '<!DOCTYPE html><html lang="en"><head>'+h.innerHTML+'</head><body>'+c.innerHTML+'<script type="application/json" id="seed">'+JSON.stringify(S).replace(/</g,'\\u003c')+'<\/script><script id="app">'+$('app').textContent+'<\/script></body></html>'}
async function commit(){if(!art)return say('Open this page while signed in to Claude as the owner to publish changes.');say('Publishing...');try{await art.publish(buildDoc())}catch(e){say(e&&e.code==='conflict'?'The page changed elsewhere. Reloading...':'Could not publish: '+((e&&(e.message||e.code))||'error'))}}
const wa=m=>`https://wa.me/${S.wa}${m?'?text='+encodeURIComponent(m):''}`;
const minp=p=>p.plans.length?Math.min(...p.plans.map(x=>x.p)):0;
const cats=()=>[...new Set(S.p.map(p=>p.cat))];
const badge=p=>{const i=/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/.test(p.img||'');return `<div class="mono" style="${i?`background:#fff url(${p.img}) center/cover no-repeat`:`background:hsl(${hue(p.name||'x')} 45% 38%)`}">${i?'':esc(p.name)}</div>`};
const card=(p,i)=>`<a class="card rv" style="transition-delay:${(i%6)*70}ms" href="#/p/${esc(p.id)}"><div class="top">${badge(p)}<div class="pill"><small>from</small>${naira(minp(p))}</div></div><div class="body"><span class="tag">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="d">${esc(p.desc)}</p><span class="btn">View &amp; buy</span></div></a>`;
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
const co=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;co.unobserve(x.target);const e=x.target,n=+e.dataset.n,pf=e.dataset.p||'',t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1200);e.textContent=pf+Math.round(n*(1-Math.pow(1-k,3))).toLocaleString('en-NG');if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}),{threshold:.5});
const reveal=()=>{document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));document.querySelectorAll('.stats b').forEach(b=>co.observe(b))};
function rz(f,n,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=n;const z=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,n,n);cb(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)}
let C='All',Q='',ed=null,TI='',cur=null,tt,rt;
const say=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)};
const sure=(b,t)=>{if(b.dataset.arm)return true;b.dataset.arm=1;b.textContent='Tap again to confirm';setTimeout(()=>{delete b.dataset.arm;b.textContent=t},3500);return false};

function home(){return `<section class="hero"><h1>Get <span class="rw" id="rw">${esc(S.p[0]?S.p[0].name:'premium tools')}</span> at Naira prices.</h1><p>The AI, design, streaming and productivity tools you use every day, without the dollar stress. Pick a plan and finish your order on WhatsApp.</p><form class="search" id="hs"><input id="hq" placeholder="Search ChatGPT, Canva, Netflix..." aria-label="Search products"><button class="btn">Search</button></form></section>
<div class="mq" aria-hidden="true"><div>${[...S.p,...S.p].map(p=>`<span>${esc(p.name)}</span>`).join('')}</div></div>
<div class="stats"><div><b data-n="${S.p.length}">0</b>Digital tools</div><div><b data-n="${cats().length}">0</b>Categories</div><div><b data-n="${S.p.length?Math.min(...S.p.map(minp)):0}" data-p="₦">0</b>Prices from</div></div>
<h2>Find your tool</h2><div class="cats">${cats().map(c=>`<a class="cat" href="#/products/${encodeURIComponent(c)}"><b>${esc(c)}</b><span>${S.p.filter(p=>p.cat===c).length} tools</span></a>`).join('')}</div>
<h2>Trending tools</h2><div class="grid">${S.p.slice(0,6).map(card).join('')}</div><p class="more"><a class="btn" href="#/products">View all products</a></p>
<h2>Meet the owner</h2><a class="about" href="#/about" style="text-decoration:none;color:inherit;margin-top:0"><img class="own" style="width:150px;border-radius:50%" src="${esc(S.oi||OWNER)}" alt="Owner of OWOLABIDIGITALS"><div style="flex:1;min-width:220px"><h3>${esc(S.on)}</h3><p class="note" style="margin:8px 0 14px">${esc(S.bio.slice(0,150))}${S.bio.length>150?'...':''}</p><span class="btn">About &amp; contact</span></div></a>
<h2>How ordering works</h2><div class="steps"><div><b>1. Choose a plan</b><p>Open a tool and compare durations, shared or private access, and prices.</p></div><div><b>2. Send your order</b><p>Your selection fills a WhatsApp message to us. Tap send.</p></div><div><b>3. Get your access</b><p>We deliver after payment is confirmed and help you activate.</p></div></div>
<h2>Questions</h2><details><summary>How does delivery work?</summary><p>Send the pre-filled WhatsApp message and pay as instructed. Access is delivered after payment is confirmed.</p></details><details><summary>Shared or private access?</summary><p>Shared access may be used by more than one person. Private access is for you alone. Every plan says which one it is.</p></details><details><summary>What if my access stops working?</summary><p>Message us on WhatsApp while your plan is active and we will fix or replace it.</p></details>
<div class="cta rv"><h2>Ready to upgrade your tools?</h2><p>Tell us what you need on WhatsApp and we will get you set up.</p><a class="btn wa" target="_blank" rel="noopener" href="${wa('Hello OWOLABIDIGITALS, I would like to order a tool.')}">Chat on WhatsApp</a></div>`}
function prods(){return `<h1 style="margin-top:34px">All products</h1><div class="search" style="margin:16px 0"><input id="q" type="search" value="${esc(Q)}" placeholder="Search products..." aria-label="Search products"></div><div class="chips"><a class="chip${C==='All'?' on':''}" href="#/products">All</a>${cats().map(c=>`<a class="chip${c===C?' on':''}" href="#/products/${encodeURIComponent(c)}">${esc(c)}</a>`).join('')}</div><p class="meta" id="count"></p><div class="grid" id="grid"></div>`}
function fill(){const q=$('q').value.trim().toLowerCase();Q=q;const L=S.p.filter(p=>(C==='All'||p.cat===C)&&(!q||(p.name+' '+p.cat+' '+p.desc+' '+p.note).toLowerCase().includes(q)));$('count').textContent=L.length+(L.length===1?' product':' products');$('grid').innerHTML=L.length?L.map(card).join(''):'<div class="empty">Nothing matches that search. Ask us on WhatsApp and we will source it for you.</div>';reveal()}
function prod(id){cur=S.p.find(p=>p.id===id);const p=cur;if(!p)return '<p class="empty" style="margin-top:30px">That product was not found. <a href="#/products">See all products</a></p>';
const more=S.p.filter(x=>x.id!==id).sort((a,b)=>(b.cat===p.cat)-(a.cat===p.cat)).slice(0,3);
return `<a class="back" href="#/products">← All products</a><div class="pd">${badge(p)}<div><span class="tag">${esc(p.cat)}</span><h1>${esc(p.name)}</h1></div></div><p class="note">${esc(p.note||p.desc).replace(/\n/g,'<br>')}</p><h3 style="margin-top:22px">Choose a plan</h3>${p.plans.map((x,i)=>`<label class="opt"><input type="radio" name="pl" value="${i}"${i?'':' checked'}><span>${esc(x.l)} <em>· ${esc(x.a)} access</em></span><b>${naira(x.p)}</b></label>`).join('')}<div class="acts"><a class="btn wa" id="go" target="_blank" rel="noopener" href="#">Order on WhatsApp</a>${safeUrl(p.url)?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(p.url)}">Visit website</a>`:''}</div><h2>More products</h2><div class="grid">${more.map(card).join('')}</div><p class="more"><a class="btn ghost" href="#/products">View all products</a></p>`}
function updGo(){const r=document.querySelector('input[name=pl]:checked');if(!r||!cur)return;const x=cur.plans[+r.value];$('go').href=wa(`Hello OWOLABIDIGITALS, I'm interested in ${cur.name} \u2014 ${x.l} (${x.a}) \u2014 ${naira(x.p)}.`)}
function about(){return `<div class="about"><img class="own" src="${esc(S.oi||OWNER)}" alt="Owner of OWOLABIDIGITALS"><div style="flex:1;min-width:240px"><h1 style="font-size:clamp(30px,6vw,46px)">${esc(S.on)}</h1><p class="note" style="margin:14px 0 20px">${esc(S.bio).replace(/\n/g,'<br>')}</p><div class="acts"><a class="btn wa" target="_blank" rel="noopener" href="${wa('Hello OWOLABIDIGITALS, I need help choosing a tool.')}">Message me on WhatsApp</a><a class="btn ghost" href="mailto:${esc(S.em)}">${esc(S.em)}</a><a class="btn ghost" href="tel:+${esc(S.wa)}">Call</a></div></div></div>`}
const planRow=x=>`<div class="r"><input class="pl" value="${esc(x.l)}" placeholder="1 Month" aria-label="Plan"><select class="pa" aria-label="Access"><option${x.a==='Shared'?' selected':''}>Shared</option><option${x.a==='Private'?' selected':''}>Private</option></select><input class="pp" type="number" value="${x.p}" placeholder="Price" aria-label="Price"><button class="btn ghost" data-a="rp" aria-label="Remove plan">✕</button></div>`;
function admin(){
if(ed===null)return `<h1 style="margin-top:34px">Admin</h1><p class="meta">Only you can see this page. Your changes go live for everyone when you tap a Save button.</p>
<div class="adm"><b>Contact and owner</b><label>WhatsApp number (country code, no +)<input id="sw" value="${esc(S.wa)}"></label><label>Email<input id="se" value="${esc(S.em)}"></label><label>Community link (https://...)<input id="sc" value="${esc(S.cm)}"></label><label>Owner name or title<input id="son" value="${esc(S.on)}"></label><label>About text<textarea id="sob" rows="4">${esc(S.bio)}</textarea></label><label>Owner photo<input type="file" id="soi" accept="image/*"></label><img id="op" class="own" style="width:120px;border-radius:16px;animation:none" src="${esc(S.oi||OWNER)}" alt="Owner photo preview"><div><button class="btn ghost" data-a="rsown">Use the original photo</button> <button class="btn" data-a="ssave">Save settings</button></div></div>
<h2 style="margin-top:34px">Products</h2>${S.p.map((p,i)=>`<div class="adm row"><span>${esc(p.name)} <em class="meta">${naira(minp(p))}</em></span><button class="btn ghost" data-e="${i}">Edit</button></div>`).join('')}<p><button class="btn" data-e="new">Add product</button> <button class="btn ghost" data-a="reset">Reset all</button></p>`;
const n=ed==='new',p=n?{name:'',cat:'',desc:'',note:'',url:'',plans:[{l:'1 Month',a:'Shared',p:0}]}:S.p[ed];
return `<a class="back" href="#/admin" data-a="back">← Back to products</a><h1 style="margin:10px 0">${n?'Add product':'Edit '+esc(p.name)}</h1><div class="adm"><label>Name<input id="fn" value="${esc(p.name)}"></label><label>Category<input id="fc" value="${esc(p.cat)}" placeholder="AI, Design, Streaming..."></label><label>Short description<input id="fd" value="${esc(p.desc)}"></label><label>Write-up (shown on the product page)<textarea id="fnote" rows="5">${esc(p.note)}</textarea></label><label>Website link (optional, https://...)<input id="fl" value="${esc(p.url)}"></label><label>Picture<input type="file" id="fimg" accept="image/*"></label><div id="pv">${badge({name:p.name,img:TI})}</div><div><button class="btn ghost" data-a="rmimg">Remove picture</button></div><b>Plans</b><div id="pls" style="display:grid;gap:8px">${p.plans.map(planRow).join('')}</div><div><button class="btn ghost" data-a="addp">Add plan</button></div></div><p><button class="btn" data-a="save">Save product</button> ${n?'':'<button class="btn ghost" data-a="del">Delete</button>'}</p>`}

function links(){$('hwa').href=$('fab').href=$('fw').href=wa('Hello OWOLABIDIGITALS, I need help choosing a tool.');$('ph').textContent='+'+S.wa;$('fe').href='mailto:'+S.em;$('fe').textContent=S.em;const f=$('fc');safeUrl(S.cm)?(f.href=S.cm,f.classList.remove('hide')):f.classList.add('hide')}
function render(){const a=(location.hash||'#/').slice(2).split('/'),k=a[0];
document.querySelectorAll('nav a[data-n]').forEach(l=>l.classList.toggle('on',l.dataset.n===k));
if(k==='products'){C=a[1]?decodeURIComponent(a[1]):'All';V.innerHTML=prods();$('q').oninput=fill;fill()}
else if(k==='p'){V.innerHTML=prod(a[1]);updGo()}
else if(k==='about')V.innerHTML=about();
else if(k==='admin')V.innerHTML=isOwner?admin():'<p class="empty" style="margin-top:30px">This page is not available. <a href="#/">Go home</a></p>';
else{V.innerHTML=home();$('hs').onsubmit=e=>{e.preventDefault();Q=$('hq').value;location.hash='#/products'}}
clearInterval(rt);const rw=$('rw'),W=S.p.slice(0,6).map(p=>p.name);
if(rw&&W.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches){let k=0;rt=setInterval(()=>{k=(k+1)%W.length;rw.textContent=W[k];rw.classList.remove('sw');void rw.offsetWidth;rw.classList.add('sw')},2200)}
document.querySelectorAll('.cat,.steps div,.stats div,.about').forEach(e=>e.classList.add('rv'));
reveal();links()}
window.addEventListener('hashchange',()=>{ed=null;render();scrollTo(0,0)});

V.onchange=e=>{const t=e.target,i=t.id;
if(t.name==='pl')return updGo();
if(i==='soi'&&t.files[0])return rz(t.files[0],420,d=>{t.value='';S.oi=d;$('op').src=d;say('Photo ready. Tap Save settings.')});
if(i==='fimg'&&t.files[0])return rz(t.files[0],200,d=>{t.value='';TI=d;$('pv').innerHTML=badge({name:$('fn').value,img:d});say('Picture ready. Tap Save product.')});
const m={sw:'wa',se:'em',sc:'cm',son:'on',sob:'bio'}[i];
if(m){let v=t.value.trim();if(m==='wa')v=v.replace(/\D/g,'')||S.wa;if(m==='cm'&&v&&!safeUrl(v)){say('Links must start with https://');v='';t.value=''}S[m]=v;save();links()}};
V.onclick=e=>{const b=e.target.closest('[data-a],[data-e]');if(!b)return;const a=b.dataset.a;
if(b.dataset.e!==undefined){ed=b.dataset.e==='new'?'new':+b.dataset.e;TI=ed==='new'?'':(S.p[ed].img||'');return render()}
if(a==='back'){e.preventDefault();ed=null;return render()}
if(a==='rmimg'){TI='';$('fimg').value='';$('pv').innerHTML=badge({name:$('fn').value});say('Picture removed. Tap Save product.')}
if(a==='rsown'){delete S.oi;$('op').src=OWNER;say('Original photo restored. Tap Save settings.')}
if(a==='ssave')commit();
if(a==='addp')$('pls').insertAdjacentHTML('beforeend',planRow({l:'1 Month',a:'Shared',p:0}));
if(a==='rp')b.closest('.r').remove();
if(a==='reset'&&sure(b,'Reset all')){S.p=JSON.parse(JSON.stringify(DEF));render();commit()}
if(a==='del'&&sure(b,'Delete')){S.p.splice(ed,1);ed=null;render();commit()}
if(a==='save'){const u=$('fl').value.trim(),name=$('fn').value.trim();
 if(!name)return say('Enter a product name.');if(u&&!safeUrl(u))return say('Links must start with https://');
 const plans=[...document.querySelectorAll('#pls .r')].map(r=>({l:r.querySelector('.pl').value.trim()||'1 Month',a:r.querySelector('.pa').value,p:Math.max(0,+r.querySelector('.pp').value||0)}));
 if(!plans.length)return say('Add at least one plan.');
 const o={id:ed==='new'?slug(name)+'-'+Date.now().toString(36).slice(-3):S.p[ed].id,name,cat:$('fc').value.trim()||'Other',desc:$('fd').value.trim(),note:$('fnote').value.trim(),url:u,img:TI,plans};
 ed==='new'?S.p.push(o):S.p[ed]=o;ed=null;render();commit()}};
render();
(async()=>{try{const u=await claude.use('user');if(u&&u.isOwner()){isOwner=true;art=await claude.use('artifact');$('al').classList.remove('hide');if(location.hash.startsWith('#/admin'))render()}}catch(e){}})();
